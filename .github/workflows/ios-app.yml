name: DUSTORE iOS app
on:
  push:
    paths: ["ios/**", ".github/workflows/ios-app.yml"]
  workflow_dispatch:
jobs:
  ios:
    name: iPhone app · ${{ matrix.edition }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [free]
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Generate the Xcode project
        run: cd ios && xcodegen generate
      - name: Edition
        run: |
          if [ "${{ matrix.edition }}" = "prime" ]; then
            echo "COND=PRIME" >> "$GITHUB_ENV"; echo "NAME=DustoreX Prime" >> "$GITHUB_ENV"
          else
            echo "COND=" >> "$GITHUB_ENV"; echo "NAME=DustoreX" >> "$GITHUB_ENV"
          fi
      - name: Build for iPhone (unsigned .ipa)
        run: |
          xcodebuild -project ios/DustoreX.xcodeproj -scheme DustoreX -configuration Release -sdk iphoneos \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "SWIFT_ACTIVE_COMPILATION_CONDITIONS=$COND" "DUSTORE_DISPLAY_NAME=$NAME" build | tail -30
          mkdir -p out/Payload
          cp -R build/device/Build/Products/Release-iphoneos/DustoreX.app out/Payload/
          plutil -p out/Payload/DustoreX.app/Info.plist | grep -E "CFBundleDisplayName|CFBundleShortVersionString"
          (cd out && zip -qr "DustoreX-iOS-${{ matrix.edition }}.ipa" Payload && rm -rf Payload)
          ls -la out
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/DustoreX.xcodeproj -scheme DustoreX -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            "SWIFT_ACTIVE_COMPILATION_CONDITIONS=$COND" "DUSTORE_DISPLAY_NAME=$NAME" build | tail -15
      - name: eX on a simulated iPhone — PODIEZD (Godot 4.7.1 Mac build) moved and started
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Release-iphonesimulator/DustoreX.app
          DATA=$(xcrun simctl get_app_container "$UDID" ru.dustore.launcher.ios data)
          mkdir -p "$DATA/Documents"
          cp ci/game/PODIEZD-macOS.zip "$DATA/Documents/selftest.zip"
          xcrun simctl launch "$UDID" ru.dustore.launcher.ios -dustoreSelfTest
          for i in $(seq 1 90); do
            sleep 5
            if [ -f "$DATA/Documents/selftest.json" ] && grep -q '"game"\|"error"' "$DATA/Documents/selftest.json"; then break; fi
          done
          mkdir -p out/shots
          sleep 15; xcrun simctl io "$UDID" screenshot out/shots/game-15s.png
          sleep 25; xcrun simctl io "$UDID" screenshot out/shots/game-40s.png
          sleep 30; xcrun simctl io "$UDID" screenshot out/shots/game-70s.png
          cp "$DATA/Documents/selftest.json" out/selftest.json || true
          cp "$DATA"/Documents/frame-*.jpg out/shots/ 2>/dev/null || true
          cat out/selftest.json || true
          xcrun simctl terminate "$UDID" ru.dustore.launcher.ios || true
          xcrun simctl launch "$UDID" ru.dustore.launcher.ios; sleep 8
          xcrun simctl io "$UDID" screenshot out/shots/library.png
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("out/selftest.json"))
          ok = r.get("kind") == "godot" and "index.wasm" in r.get("webFiles", []) and "index.pck" in r.get("webFiles", []) and str(r.get("game", "")).startswith("started")
          if r.get("edition") == "Free":
              ok = ok and r.get("quotaFourthRefused") is True and r.get("quotaNewServerDayResets") is True
          print("SELFTEST", "PASS" if ok else "FAIL")
          sys.exit(0 if ok else 1)
          EOF
      - name: Same game in desktop WebKit (Safari engine) and Chromium — is the black frame the simulator or WebKit?
        if: always()
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices booted -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v))")
          DATA=$(xcrun simctl get_app_container "$UDID" ru.dustore.launcher.ios data)
          WEB=$(dirname "$(find "$DATA/Documents/Games" -name index.wasm | head -1)")
          echo "web build: $WEB"; ls -la "$WEB"
          (cd "$WEB" && nohup python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 3; curl -sI http://127.0.0.1:8765/index.html | head -3
          python3 -m venv "$RUNNER_TEMP/pw" && "$RUNNER_TEMP/pw/bin/pip" install --quiet playwright && "$RUNNER_TEMP/pw/bin/python" -m playwright install webkit chromium >/dev/null
          "$RUNNER_TEMP/pw/bin/python" - <<'EOF'
          import asyncio
          from playwright.async_api import async_playwright
          async def shoot(browser_type, name):
              b = await browser_type.launch()
              page = await b.new_page(viewport={"width": 1280, "height": 720})
              logs = []
              page.on("console", lambda m: logs.append(m.text))
              await page.goto("http://127.0.0.1:8765/index.html", wait_until="commit", timeout=120000)
              await page.wait_for_timeout(30000)
              await page.screenshot(path=f"out/shots/{name}-15s.png")
              await page.mouse.click(640, 360)
              await page.wait_for_timeout(20000)
              await page.screenshot(path=f"out/shots/{name}-35s.png")
              open(f"out/shots/{name}-console.txt", "w").write(chr(10).join(logs[:120]))
              await b.close()
          async def main():
              async with async_playwright() as p:
                  await shoot(p.webkit, "webkit")
                  await shoot(p.chromium, "chromium")
          asyncio.run(main())
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DustoreX-iOS-${{ matrix.edition }}
          path: out
