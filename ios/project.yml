name: DustoreX
options:
  bundleIdPrefix: ru.dustore
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DUSTORE_DISPLAY_NAME: DustoreX
targets:
  DustoreX:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.dustore.launcher.ios
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
